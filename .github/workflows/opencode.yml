name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  # Responde a las menciones (/opencode o /oc) en comentarios de issues, PRs y
  # revisiones de código. Puede crear ramas, abrir PRs y comentar.
  # Solo el propietario del repo (author_association OWNER) puede lanzarlo: el job recibe
  # secretos y el agente tiene shell, así que nadie más debe poder darle instrucciones.
  opencode:
    if: |
      github.event.comment.author_association == 'OWNER' && (
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))) ||
      (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20 # si opencode se queda esperando una aprobación de permisos, no esperar 6 h
    permissions:
      id-token: write # intercambio OIDC por el token de la GitHub App de opencode
      contents: read # checkout del repositorio (también en repos privados)
      actions: read # leer resultados de CI de la PR
      pull-requests: read # comprobar si la PR viene de un fork
      issues: write # gh del agente: comentar en issues/PRs (p. ej. la skill plan-feature)
    steps:
      # En una PR, opencode trabaja sobre el código de la PR y carga su .opencode/ (permisos y
      # agentes). Si la PR viene de un fork, ese código no es de confianza: podría abrirse todos
      # los permisos y ejecutarse con los secretos y el token de la app. Se cortan antes del checkout.
      # (issue_comment no incluye el repo de origen de la PR, por eso se consulta con la API.)
      - name: Rechazar PRs de forks
        if: github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          head_repo="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name // ""')"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::La PR #${PR_NUMBER} viene de un fork (${head_repo:-repositorio eliminado}); opencode no se ejecuta sobre código externo."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # gh autenticado para las skills que lo usan (plan-feature lee la issue y publica el plan).
          GH_TOKEN: ${{ github.token }}
          # Permisos solo para CI, por encima de .opencode/opencode.json: en CI nadie puede aprobar un
          # "ask" (el job se queda colgado), así que lo de fuera del repo se deniega, igual que buscar
          # credenciales con git o gh.
          OPENCODE_CONFIG_CONTENT: >-
            {"permission": {"external_directory": "deny",
            "bash": {"git credential*": "deny", "git config --get*credential*": "deny", "gh auth token*": "deny"}}}
        with:
          model: opencode/deepseek-v4.1-flash-free
          mentions: /opencode,/oc
          # Opcional: prompt propio. Si no se indica, opencode ejecuta las
          # instrucciones del comentario que lo ha mencionado.
          # prompt: 'Actualiza la descripción del PR con un resumen de los cambios.'

  # Abre una sesión de opencode para issues nuevas o asignadas que mencionan a
  # opencode. El evento `issues` no tiene comentario del que sacar el prompt,
  # por eso aquí sí es obligatorio pasar `prompt`.
  opencode-issues:
    if: |
      github.event_name == 'issues' &&
      github.event.issue.author_association == 'OWNER' && (
        contains(github.event.issue.title, '/opencode') || contains(github.event.issue.title, '/oc') ||
        contains(github.event.issue.body, '/opencode') || contains(github.event.issue.body, '/oc')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20 # si opencode se queda esperando una aprobación de permisos, no esperar 6 h
    permissions:
      id-token: write
      contents: read
      issues: write # gh del agente: comentar en la issue
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # gh autenticado para las skills que lo usan (plan-feature lee la issue y publica el plan).
          GH_TOKEN: ${{ github.token }}
          # Permisos solo para CI, por encima de .opencode/opencode.json: en CI nadie puede aprobar un
          # "ask" (el job se queda colgado), así que lo de fuera del repo se deniega, igual que buscar
          # credenciales con git o gh.
          OPENCODE_CONFIG_CONTENT: >-
            {"permission": {"external_directory": "deny",
            "bash": {"git credential*": "deny", "git config --get*credential*": "deny", "gh auth token*": "deny"}}}
        with:
          model: opencode/deepseek-v4.1-flash-free
          prompt: |
            Atiende la petición de la issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".

            Lee el cuerpo de la issue y sus comentarios para entender qué se pide. Si la petición es
            clara y acotada, impleméntala en una rama nueva y abre un PR que la resuelva, siguiendo las
            convenciones descritas en AGENTS.md. Si falta información o la petición es ambigua, no
            cambies código: responde en la issue con las preguntas necesarias.
